# =========================================================================
#  DonTrack - deploiement Fly.io (version web uniquement)
#
#  Le volume monte sur /data porte la base SQLite : sans lui, les dons
#  disparaitraient a chaque redeploiement.
#
#  Rappel des commandes :
#     fly volumes create dontrack_data --size 1 --region cdg
#     fly secrets set DONTRACK_ADMIN_PASSWORD="..."   (facultatif)
#     fly deploy
# =========================================================================

app = 'dontrack'
primary_region = 'cdg'

[build]
[env]
  DONTRACK_DATA = '/data'
  DONTRACK_HTTPS = '1'
  DONTRACK_TRUST_PROXY = '1'
  HOST = '0.0.0.0'
  PORT = '8080'

[[mounts]]
  source = 'dontrack_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# 256 Mo suffisent largement : serveur Node sans aucune dependance, base
# SQLite locale. L'assistant web avait propose 2 Go, inutile et 8x plus cher.
[[vm]]
  size = 'shared-cpu-1x'
  cpus = 1
  memory = '256mb'
