# =========================================================================
#  DonTrack — déploiement Fly.io
#
#  Choisi pour une raison précise : c'est l'offre gratuite qui propose un
#  volume persistant. La base SQLite y survit aux redéploiements, ce qui
#  n'est pas le cas des hébergeurs à disque éphémère.
#
#  Mise en ligne :
#     fly launch --no-deploy --copy-config
#     fly volumes create dontrack_data --size 1 --region cdg
#     fly secrets set DONTRACK_ADMIN_PASSWORD="choisissez-un-mot-de-passe"
#     fly deploy
# =========================================================================

app = "dontrack"
primary_region = "cdg"          # Paris ; "jnb" pour Johannesburg, "cdg" convient à l'Afrique de l'Ouest

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DONTRACK_DATA = "/data"
  DONTRACK_HTTPS = "1"
  DONTRACK_TRUST_PROXY = "1"

# Le volume porte la base : sans lui, les dons disparaîtraient à chaque déploiement.
[[mounts]]
  source = "dontrack_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # mise en veille quand personne ne s'en sert
  auto_start_machines = true       # réveil à la première visite
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
